<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sequoia — Sign in</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="brand">
      <div class="logo">Sequoia</div>
      <p class="tag">Minimal student planner</p>
    </header>

    <section class="card">
      <h2>Sign in</h2>
      <form id="signin-form">
        <label for="email">College email</label>
        <input id="email" name="email" type="email" required placeholder="you@college.edu" />
        <button type="submit" class="btn primary">Continue</button>
      </form>
      <p class="muted">This is a BETA. Sign-in is local for now — your session is stored in your browser.</p>
    </section>
  </main>

  <script src="signin.js"></script>
</body>
</html>
