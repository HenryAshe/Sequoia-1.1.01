<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequoia | Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-[#1B3022] to-[#0B1A10] min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/95 p-10 rounded-2xl shadow-2xl w-full max-w-md backdrop-blur-sm border border-white/20">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-[#1B3022] tracking-tighter mb-2">SEQUOIA</h1>
            <p class="text-slate-500 font-medium italic">Organize your academic roots.</p>
        </div>
        <form id="signin-form" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-[#1B3022] uppercase tracking-widest mb-2">University Email</label>
                <input type="email" name="email" required placeholder="name@auburn.edu" 
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#3A5A40] focus:outline-none transition-all">
            </div>
            <button type="submit" class="w-full bg-[#1B3022] text-white py-4 rounded-xl font-bold hover:bg-[#3A5A40] transition-colors shadow-lg shadow-[#1B3022]/20">
                Enter Dashboard
            </button>
        </form>
    </div>
    <script src="signin.js"></script>
</body>
</html>
