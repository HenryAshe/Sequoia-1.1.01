<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequoia | Auburn Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <!-- Navigation -->
    <nav class="bg-orange-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold italic">SEQUOIA</h1>
            <span id="user-name" class="text-sm opacity-90 italic text-white/80">Loading profile...</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-6 text-slate-800">Your Auburn Courses</h2>
        
        <!-- Course Grid -->
        <div id="course-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here by JavaScript -->
            <div class="animate-pulse bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="h-4 bg-slate-200 rounded w-3/4 mb-4"></div>
                <div class="h-10 bg-slate-100 rounded mb-2"></div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = "https://sequoia-v1.onrender.com"; // PASTE YOUR RENDER LINK HERE

        async function loadDashboard() {
            try {
                // 1. Fetch Profile for the header
                const profileRes = await fetch(`${API_BASE}/profile`);
                const profile = await profileRes.json();
                document.getElementById('user-name').innerText = `War Eagle, ${profile.name}!`;

                // 2. Fetch Courses
                const courseRes = await fetch(`${API_BASE}/my-courses`);
                const courses = await courseRes.json();
                
                const container = document.getElementById('course-container');
                container.innerHTML = ''; // Clear loading skeleton

                courses.forEach(course => {
                    const card = `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                            <h3 class="text-xl font-bold text-orange-700 mb-2">${course.course_name}</h3>
                            <p class="text-slate-500 text-sm mb-4">ID: ${course.id}</p>
                            <button class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-700">
                                View Analytics
                            </button>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('course-container').innerHTML = `<p class="text-red-500">Failed to load data. Make sure Render is awake!</p>`;
            }
        }

        loadDashboard();
    </script>
</body>
</html>
